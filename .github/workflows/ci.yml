# The repository is private and nothing is paid for: Actions get the free
# monthly minutes and nothing beyond -- when they run out, runs stop until
# the next month, nothing is charged. A Windows runner counts twice. So a
# push runs go vet and the tests only, and only when Go code changed (about
# four minutes of the quota). The race detector, and the release build on a
# tag, run by hand only:
#   gh workflow run CI                  go vet, tests, race tests
#   gh workflow run CI --ref vX.Y.Z     the same, then a draft release
name: CI

on:
  push:
    branches: [main]
    paths: ['**.go', 'go.mod', 'go.sum', '.github/workflows/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: go test -race
        if: github.event_name == 'workflow_dispatch'
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...

  release:
    needs: test
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tag matches version.go
        shell: pwsh
        run: |
          $v = (Select-String -Path internal\version\version.go -Pattern 'Version = "(.+)"').Matches.Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }}, version.go says $v" }
      - name: Build
        shell: pwsh
        run: .\build.ps1
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $zip = "dpiswitch-$v-windows-amd64.zip"
          New-Item -ItemType Directory rel | Out-Null
          Copy-Item dist\dpiswitch.exe rel\
          Compress-Archive -Path rel\dpiswitch.exe -DestinationPath $zip -CompressionLevel Optimal
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD\SHA256SUMS.txt", "$h  $zip`n")
          "ZIP=$zip" >> $env:GITHUB_ENV
      # a draft: the notes are written by hand, then it is published
      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:ZIP SHA256SUMS.txt --clobber
          } else {
            gh release create $tag $env:ZIP SHA256SUMS.txt --draft --title "DPI Switch $($tag.TrimStart('v'))" --notes "Built by CI from $tag. Notes to follow."
          }
          if ($LASTEXITCODE) { throw "gh release failed" }
