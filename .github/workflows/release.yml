# Builds DPI Switch the way build.ps1 does, on a Windows machine of GitHub's,
# and publishes the release: the tag v<version> on the commit built,
# dpiswitch-<version>-windows-amd64.zip and SHA256SUMS.txt, and the notes
# from .github/release-notes/<version>.md.
#
# To release: put the version in internal/version/version.go and the notes
# in .github/release-notes/<version>.md on main, then Actions -> Release ->
# Run workflow with that version. A version already released is refused.
#
# The core is built from the private chesnokovap10/mihomo-dpiswitch (see
# tools/build-mihomo.ps1): the repository secret MIHOMO_TOKEN is a token that
# can read that repository (a fine-grained one, Contents: read-only, on it
# alone). Nothing else needs it; the release itself is made with the
# workflow's own token.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, as in internal/version/version.go (e.g. 1.5.0)"
        required: true

permissions:
  contents: write

# two runs for one version would race for its tag
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # no token left in the clone's git config: git sent it, not
      # MIHOMO_TOKEN, for the core's repository too, and could not see it
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check the version, the notes and the tag
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "'$env:VERSION' is not a version like 1.5.0" }
          $inFile = (Select-String -Path internal\version\version.go -Pattern 'Version = "(.+)"').Matches.Groups[1].Value
          if ($inFile -ne $env:VERSION) { throw "internal/version/version.go says $inFile, not $env:VERSION" }
          if (-not (Test-Path ".github\release-notes\$env:VERSION.md")) { throw "no notes: .github/release-notes/$env:VERSION.md" }
          $tags = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/v$env:VERSION" --jq '.[].ref'
          if ($LASTEXITCODE) { throw "the tags could not be read" }
          if (@($tags) -contains "refs/tags/v$env:VERSION") { throw "v$env:VERSION is released already" }

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Let git read the core's source
        env:
          MIHOMO_TOKEN: ${{ secrets.MIHOMO_TOKEN }}
        run: |
          if (-not $env:MIHOMO_TOKEN) { throw "the MIHOMO_TOKEN secret is not set: see the top of .github/workflows/release.yml" }
          git config --global url."https://x-access-token:$($env:MIHOMO_TOKEN)@github.com/chesnokovap10/mihomo-dpiswitch".insteadOf "https://github.com/chesnokovap10/mihomo-dpiswitch"
          # asked outside the clone: nothing of its config in the way
          git -C $env:RUNNER_TEMP ls-remote https://github.com/chesnokovap10/mihomo-dpiswitch HEAD | Out-Null
          if ($LASTEXITCODE) { throw "MIHOMO_TOKEN cannot read chesnokovap10/mihomo-dpiswitch: its repository access or its Contents permission" }

      # vet, the tests, the core, the Windows resources and the exe
      - name: Build
        run: .\build.ps1

      - name: Pack
        run: |
          $name = "dpiswitch-$env:VERSION-windows-amd64.zip"
          Compress-Archive -Path dist\dpiswitch.exe -DestinationPath "dist\$name" -CompressionLevel Optimal
          $hash = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLower()
          # as sha256sum writes it, so `sha256sum -c` checks it
          [IO.File]::WriteAllText("$PWD\dist\SHA256SUMS.txt", "$hash  $name`n")
          Get-Content dist\SHA256SUMS.txt

      - name: Publish
        run: |
          gh release create "v$env:VERSION" --target "$env:GITHUB_SHA" --title "DPI Switch $env:VERSION" `
            --notes-file ".github\release-notes\$env:VERSION.md" `
            "dist\dpiswitch-$env:VERSION-windows-amd64.zip" dist\SHA256SUMS.txt
          if ($LASTEXITCODE) { throw "the release was not made" }
