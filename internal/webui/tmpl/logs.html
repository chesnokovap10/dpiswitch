{{define "content"}}{{$d := .Data}}
<div class="page">
  <div class="logtools">
    <div class="tabs">
      <a href="/logs?name=service" class="{{if eq $d.Name "service"}}on{{end}}" title="service.log">{{.T "Controller and service"}}</a>
      <a href="/logs?name=core" class="{{if eq $d.Name "core"}}on{{end}}" title="mihomo.log">{{.T "Core"}}</a>
      <a href="/logs?name=tray" class="{{if eq $d.Name "tray"}}on{{end}}" title="controller.log">{{.T "Tray and UI"}}</a>
    </div>
    <label class="cb"><input type="checkbox" id="follow" checked> {{.T "Follow the end"}}</label>
    <span class="spacer"></span>
    <span class="muted">{{.T "Last 400 lines, refreshed every 3 seconds"}}</span>
  </div>
  <pre class="fill" id="log" data-poll="/frag/logs/log?name={{$d.Name}}" data-every="3" data-follow>{{template "log" .}}</pre>
</div>
{{end}}

{{define "log"}}{{.Data.Text}}{{end}}
